<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidak ada koneksi</title>
<style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7faf0; color: #16210f; text-align: center; }
    main { max-width: 22rem; }
    .ikon { width: 4rem; height: 4rem; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 1.5rem; background: #d7edb8; color: #2f6d21; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; line-height: 1.55; color: #4c5c3d; }
    button { min-height: 3rem; width: 100%; border: 0; border-radius: 1rem; background: #2f6d21; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
        body { background: #10150c; color: #e7efdc; }
        .ikon { background: #24401b; color: #b6e26a; }
        p { color: #b7c4a8; }
        button { background: #b6e26a; color: #14330d; }
    }
</style>
</head>
<body>
<main>
    <div class="ikon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Tidak ada koneksi internet</h1>
    <p>Absen dan data sekolah butuh internet. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
<script>
    // Muat ulang sendiri begitu koneksi kembali.
    window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
